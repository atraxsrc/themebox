# Builds the applet on GitHub, never on a personal machine: Rust binaries can
# carry the build machine's paths, and a public binary must not.
#
# Two jobs on purpose. Build runs third-party build scripts, so it can only read.
# Publish holds the write token and runs no dependency code.
name: Release applet

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04   # same base as Pop!_OS 24.04, so glibc matches
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libdbus-1-dev libfontconfig-dev libfreetype-dev libegl-dev
      - name: Build
        working-directory: applet
        run: cargo build --release --locked
      - name: Package
        run: |
          cp applet/target/release/themebox-applet themebox-applet-x86_64
          strip themebox-applet-x86_64
          cp themebox-applet-x86_64 themebox-applet
          sha256sum themebox-applet > themebox-applet-x86_64.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: applet
          path: |
            themebox-applet-x86_64
            themebox-applet-x86_64.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: applet
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" themebox-applet-x86_64 themebox-applet-x86_64.sha256 --generate-notes
