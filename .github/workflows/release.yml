# Builds the applet on GitHub, never on a personal machine: Rust binaries can
# carry the build machine's paths, and a public binary must not.
name: Release applet

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04   # same base as Pop!_OS 24.04, so glibc matches
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libdbus-1-dev libfontconfig-dev libfreetype-dev libegl-dev
      - name: Build
        working-directory: applet
        run: cargo build --release --locked
      - name: Package
        run: |
          cp applet/target/release/cosmic-rice-applet cosmic-rice-applet-x86_64
          strip cosmic-rice-applet-x86_64
          cp cosmic-rice-applet-x86_64 cosmic-rice-applet
          sha256sum cosmic-rice-applet > cosmic-rice-applet-x86_64.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" cosmic-rice-applet-x86_64 cosmic-rice-applet-x86_64.sha256 --generate-notes
